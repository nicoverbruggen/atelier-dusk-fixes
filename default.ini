#########################################
## Settings for Atelier Dusk Fixes
##
## Place beside the game executable, next to d3d11.dll. Every value here is the
## default, so deleting the file (or any single line) changes nothing.
##
## Most of this is easier to set in dusk-fix-launcher.exe. Edit here for the
## few options the launcher does not show, or to see what the defaults are.
##
## Options a game does not support are ignored there, whatever this file says.
#########################################

[Rendering]
DisplayWidth=0
DisplayHeight=0
Supersampling=100
SupersamplingSharpen=35
Sharpen=0
SMAA=true

## One key is left out of this file rather than given a value, because it has no
## single default: the capability matrix turns it on for Atelier Ayesha and
## leaves it opt-in for the other two. Writing the line here would turn the
## feature OFF on the game that ships it on.
##
##   AnisotropicFiltering  16 on Ayesha, 1 (off) on the other two
##
## Set it yourself if you want to, or use the launcher, which knows which game
## it is sitting next to.

[Startup]
SkipLogos=false
SkipIntroMovie=false

[Interface]
SteadyControlPrompt=false
HideControlPrompt=false

[Launcher]
SkipLauncher=false
AutoResolution=false
