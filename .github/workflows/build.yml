name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Build the released binaries with MSVC rather than the local MinGW cross-build.
# MSVC output is less likely to trip antivirus ML heuristics, and one job per
# architecture keeps the compiler environment unambiguous: x64 for the game DLL
# and launcher, x86 for the 32-bit front-end proxy.
jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
      # Static CRT linking means the drop-in release does not require a Visual
      # C++ redistributable installed separately on the player's machine.
      - run: meson setup build64 --buildtype release -Db_vscrt=static_from_buildtype
      # Resource compilers embed manifests without validating their XML. Windows
      # otherwise reports only a vague side-by-side configuration failure.
      - name: Check launcher manifest
        run: python -c "import xml.dom.minidom; xml.dom.minidom.parse('src/launcher/dusk-fix-launcher.manifest')"
      - run: meson compile -C build64
      - name: Check d3d11 proxy exports
        run: python scripts/check_exports.py build64/d3d11.dll
      - name: Check proxy safety contracts
        run: python scripts/check_core_contract.py
      - name: Check asynchronous lifecycle contract
        run: python scripts/check_lifecycle_contract.py
      - name: Check release attribution contract
        run: python scripts/check_release_contract.py
      - uses: actions/upload-artifact@v7
        with:
          name: d3d11
          path: |
            build64/d3d11.dll
            build64/dusk-fix-launcher.exe

  build-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install meson ninja
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x86
      - run: meson setup build32 --buildtype release -Db_vscrt=static_from_buildtype
      - run: meson compile -C build32
      - name: Check msimg32 proxy exports
        run: python scripts/check_exports.py build32/msimg32.dll
      - uses: actions/upload-artifact@v7
        with:
          name: msimg32
          path: build32/msimg32.dll

  # Assemble the archive on every build so the tested artifact has the same
  # layout users will receive from a tagged release.
  package:
    needs: [build-x64, build-x86]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v8
        with:
          name: d3d11
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: msimg32
          path: dist
      - name: Check version
        run: python3 scripts/read_version.py VERSION
      # default.ini ships to users and repeats defaults that live in src/, so
      # check it before packaging rather than spending a separate runner on it.
      - name: Check shipped configuration defaults
        run: python3 scripts/check_default_ini.py
      - name: Check launcher contract
        run: python3 scripts/check_launcher_contract.py
      - name: Check transactional mutation contract
        run: python3 scripts/check_transaction_contract.py
      - name: Assemble the archive
        run: |
          mkdir -p dist/dusk-fix
          cp README.md LICENSE dist/dusk-fix/
          mkdir -p dist/dusk-fix/LICENSES
          cp vendor/minhook/LICENSE.txt dist/dusk-fix/LICENSES/MinHook.txt
          cp vendor/smaa/LICENSE.txt dist/dusk-fix/LICENSES/SMAA.txt
          # Shipped under its final name so the archive extracts straight into
          # the game directory with nothing to rename.
          cp default.ini dist/dusk-fix.ini
          cd dist
          zip -r ../dusk-fix.zip \
            d3d11.dll dusk-fix-launcher.exe msimg32.dll dusk-fix.ini dusk-fix
      - uses: actions/upload-artifact@v7
        with:
          name: dusk-fix
          path: dusk-fix.zip

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: dusk-fix
      - name: Name the archive for this tag
        run: mv dusk-fix.zip "dusk-fix-${GITHUB_REF_NAME}.zip"
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release is created empty: the maintainer writes the notes.
          # Auto-generating them from commits produced a wall of internal churn,
          # and deriving them from a CHANGELOG made cutting a release depend on
          # having remembered to edit a document. Neither is wanted.
          if echo "${GITHUB_REF_NAME}" | grep -qi 'pre'; then
            PRERELEASE="--prerelease"
          else
            PRERELEASE="--latest"
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" $PRERELEASE
            gh release upload "${GITHUB_REF_NAME}" "dusk-fix-${GITHUB_REF_NAME}.zip" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "dusk-fix-${GITHUB_REF_NAME}.zip" \
              --verify-tag --notes "" --title "${GITHUB_REF_NAME}" $PRERELEASE
          fi
